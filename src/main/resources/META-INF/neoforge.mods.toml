modLoader="javafml"
loaderVersion="${loader_version_range}"
license="ARR"
issueTrackerURL="https://github.com/QLNPLUS/qshop-sell-upgrade/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="qshop"
mandatory=true
versionRange="${qshop_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="qshop_sellbox"
mandatory=true
versionRange="${sellbox_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
mandatory=true
versionRange="${backpacks_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedcore"
mandatory=true
versionRange="${core_version_range}"
ordering="AFTER"
side="BOTH"
