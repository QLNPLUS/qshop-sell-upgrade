          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: qshop_sell_upgrade-neoforge-1.21.1-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

  publish-neoforge-126:
    if: github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'neoforge-126'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neoforge-1.26.1.2

      - name: Check SellBox dependency branch
        run: git ls-remote --exit-code https://github.com/QLNPLUS/Q-shop-sellbox.git refs/heads/neoforge-1.26.1.2

      - uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
