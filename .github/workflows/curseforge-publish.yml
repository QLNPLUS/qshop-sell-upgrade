            -Pqshop_jar="$GITHUB_WORKSPACE/q_shop/build/libs/qshop-neoforge-1.21.1-1.8.1.jar" \
            -Psellbox_jar="$GITHUB_WORKSPACE/q_shop_sellbox/build/libs/qshop_sellbox-neoforge-1.21.1-1.5.0.jar"

      - name: Verify artifact
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="qshop_sell_upgrade-neoforge-1.21.1-$CURSEFORGE_VERSION.jar"
          test -f "build/libs/$expected"
          echo "CURSEFORGE_FILE=build/libs/$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        run: |
          awk -v version="$CURSEFORGE_VERSION" '
            /^##[[:space:]]+/ {
