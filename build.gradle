plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base { archivesName = "qshop-sell-upgrade-neoforge-1.21.1" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client { client() }
        server { server() }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
    mavenCentral()
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

def qshopJarFile = file(findProperty('qshop_jar') ?:
        '../../q_shop/neoforge-1.21.1/build/libs/qshop-neoforge-1.21.1-1.8.1.jar')
if (!qshopJarFile.isFile()) {
    throw new GradleException('未找到 QShop 依赖 jar: ' + qshopJarFile + '\n' +
            '请先构建 D:\\projects\\q_shop\\neoforge-1.21.1，或用 -Pqshop_jar=<path> 指定。')
}

def sellboxJarFile = file(findProperty('sellbox_jar') ?:
        '../../q_shop_sellbox/neoforge-1.21.1/build/libs/qshop_sellbox-neoforge-1.21.1-1.5.0.jar')
if (!sellboxJarFile.isFile()) {
    throw new GradleException('未找到 QShop SellBox 依赖 jar: ' + sellboxJarFile + '\n' +
            '请先构建 D:\\projects\\q_shop_sellbox\\neoforge-1.21.1，或用 -Psellbox_jar=<path> 指定。')
}

dependencies {
    compileOnly files(qshopJarFile)
    compileOnly files(sellboxJarFile)
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    runtimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    runtimeOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
}

tasks.named('processResources').configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            qshop_version_range: qshop_version_range,
            sellbox_version_range: sellbox_version_range,
            backpacks_version_range: backpacks_version_range,
            core_version_range: core_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

jar {
    archiveFileName = "${mod_id}-neoforge-1.21.1-${mod_version}.jar"
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
