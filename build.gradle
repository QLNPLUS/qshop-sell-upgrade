buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = 'com.qshop'
version = findProperty('mod_version') ?: '1.1.0'
base { archivesName = 'qshop-sell-upgrade-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                qshop_sell_upgrade { source sourceSets.main }
            }
        }
        client {}
        server {}
    }
}

mixin {
    add sourceSets.main, 'qshop_sell_upgrade.refmap.json'
    config 'qshop_sell_upgrade.mixins.json'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.pkg.github.com/P3pp3rF1y/SophisticatedCore' }
    if (findProperty('dev_local_deps') == 'true') {
        flatDir { dirs '../../q_shop/forge-1.20.1/build/libs' }
        flatDir { dirs '../../q_shop_sellbox/forge-1.20.1/build/libs' }
    }
}

def qshopJarFile = file(findProperty('qshop_jar') ?:
        '../../q_shop/forge-1.20.1/build/libs/qshop-forge-1.20.1-1.8.0.jar')
if (!qshopJarFile.isFile()) {
    throw new GradleException('未找到 QShop 依赖 jar: ' + qshopJarFile + '\n' +
            '请先构建 D:\\projects\\q_shop\\forge-1.20.1，或用 -Pqshop_jar=<path> 指定。')
}

def sellboxJarFile = file(findProperty('sellbox_jar') ?:
        '../../q_shop_sellbox/forge-1.20.1/build/libs/qshop-sellbox-forge-1.20.1-1.5.0.jar')
if (!sellboxJarFile.isFile()) {
    throw new GradleException('未找到 QShop SellBox 依赖 jar: ' + sellboxJarFile + '\n' +
            '请先构建 D:\\projects\\q_shop_sellbox\\forge-1.20.1，或用 -Psellbox_jar=<path> 指定。')
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'

    compileOnly fg.deobf(files(qshopJarFile))
    compileOnly fg.deobf(files(sellboxJarFile))

    compileOnly fg.deobf('curse.maven:sophisticated-backpacks-422301:8687830')
    runtimeOnly fg.deobf('curse.maven:sophisticated-backpacks-422301:8687830')
    compileOnly fg.deobf('curse.maven:sophisticated-core-618298:8705513')
    runtimeOnly fg.deobf('curse.maven:sophisticated-core-618298:8705513')

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    if (findProperty('dev_local_deps') == 'true') {
        runtimeOnly fg.deobf('qshop:qshop-forge-1.20.1:1.8.0')
        runtimeOnly fg.deobf('qshop_sellbox:qshop-sellbox-forge-1.20.1:1.5.0')
    } else if (findProperty('dev_runtime_deps') == 'true') {
        runtimeOnly files(qshopJarFile)
        runtimeOnly files(sellboxJarFile)
    }
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'qshop_sell_upgrade',
                'Specification-Vendor': 'qshop',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'MixinConfigs': 'qshop_sell_upgrade.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
}
